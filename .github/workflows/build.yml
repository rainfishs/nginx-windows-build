name: build nginx for Windows with headers-more

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nginx_version:
        description: nginx version, e.g. 1.31.8 (empty = latest)
        default: ''
      headers_more_version:
        description: headers-more version, e.g. v0.41 (empty = latest)
        default: ''
      arch:
        description: CPU architecture
        type: choice
        options: [x64, x86]
        default: x64

permissions:
  contents: read

# One run at a time, so two runs cannot build the same release.
concurrency:
  group: ${{ github.workflow }}

env:
  ARCH: ${{ inputs.arch || 'x64' }}

jobs:
  # Latest releases, unless versions were given when running the
  # workflow manually. Nothing is built if that release already exists.
  resolve:
    runs-on: ubuntu-latest

    outputs:
      nginx: ${{ steps.v.outputs.nginx }}
      headers_more: ${{ steps.v.outputs.headers_more }}
      name: ${{ steps.v.outputs.name }}
      exists: ${{ steps.v.outputs.exists }}

    steps:
      - id: v
        env:
          WANT_NGINX: ${{ inputs.nginx_version }}
          WANT_HEADERS_MORE: ${{ inputs.headers_more_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest() {
              git ls-remote --tags --refs "$1" | sed 's#.*refs/tags/##' \
                  | grep -E "$2" | sort -V | tail -1
          }

          nginx=${WANT_NGINX:-$(latest https://github.com/nginx/nginx \
                                       '^release-[0-9]+\.[0-9]+\.[0-9]+$')}
          nginx=${nginx#release-}
          headers_more=${WANT_HEADERS_MORE:-$(latest https://github.com/openresty/headers-more-nginx-module \
                                                     '^v[0-9]+\.[0-9]+$')}
          test -n "$nginx"
          test -n "$headers_more"

          name="nginx-$nginx-headers-more-$headers_more-$ARCH"

          if gh release view "$name" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              exists=true
              echo "::notice::Release $name already exists, nothing to build"
          else
              exists=false
          fi

          {
              echo "nginx=$nginx"
              echo "headers_more=$headers_more"
              echo "name=$name"
              echo "exists=$exists"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.exists != 'true'

    # VS 2022 (v17) is listed as known to work in
    # https://nginx.org/en/docs/howto_build_on_win32.html;
    # windows-latest ships VS 2026.
    runs-on: windows-2022
    timeout-minutes: 60

    # To publish the release.
    permissions:
      contents: write

    env:
      NGINX_VERSION: ${{ needs.resolve.outputs.nginx }}
      HEADERS_MORE_VERSION: ${{ needs.resolve.outputs.headers_more }}
      PKG_NAME: ${{ needs.resolve.outputs.name }}

    defaults:
      run:
        shell: bash

    steps:
      # nginx's configure is a shell script and breaks with CRLF.
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout nginx
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: nginx/nginx
          ref: release-${{ env.NGINX_VERSION }}
          path: nginx
          persist-credentials: false

      - name: Checkout headers-more
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: openresty/headers-more-nginx-module
          ref: ${{ env.HEADERS_MORE_VERSION }}
          path: headers-more
          persist-credentials: false

      - name: Read official build settings
        run: |
          for v in OBJS OPENSSL ZLIB PCRE; do
              val=$(sed -nE "s/^$v[[:space:]]*=//p" nginx/misc/GNUmakefile | tr -d '[:space:]')
              test -n "$val"
              echo "$v=$val" | tee -a "$GITHUB_ENV"
          done

      # Each tarball must carry a valid signature by its project's
      # release key in keys/.
      - name: Download and verify libraries
        run: |
          mkdir -p dl "nginx/$OBJS/lib"

          fetch() {   # tarball url, signature suffix, key file
              local f="dl/${1##*/}" home status
              curl -fsSL --retry 3 -o "$f" "$1"
              curl -fsSL --retry 3 -o "$f$2" "$1$2"

              home=$(mktemp -d)
              gpg --homedir "$home" -q --import "$3" 2>/dev/null || true
              status=$(gpg --homedir "$home" --status-fd 1 --verify "$f$2" "$f" 2>/dev/null || true)
              if ! grep -q '^\[GNUPG:\] VALIDSIG ' <<< "$status"; then
                  echo "::error::${f#dl/} has no valid signature by $3"
                  exit 1
              fi
              echo "${f#dl/}: signed by $3"

              tar -xzf "$f" -C "nginx/$OBJS/lib"
          }

          fetch "https://github.com/openssl/openssl/releases/download/$OPENSSL/$OPENSSL.tar.gz" .asc keys/openssl.asc
          fetch "https://github.com/madler/zlib/releases/download/v${ZLIB#zlib-}/$ZLIB.tar.gz" .asc keys/zlib.asc
          fetch "https://github.com/PCRE2Project/pcre2/releases/download/$PCRE/$PCRE.tar.gz" .sig keys/pcre2.asc

          ls "nginx/$OBJS/lib"
          test -d "nginx/$OBJS/lib/$OPENSSL"
          test -d "nginx/$OBJS/lib/$ZLIB"
          test -d "nginx/$OBJS/lib/$PCRE"

      # MSVC builds nginx with the precompiled header ngx_config.h
      # (-Yungx_config.h), so every .c file must include it first.
      # headers-more includes it via ddebug.h, which fails with
      # C4603/C2143, see headers-more issues #24 and #167.
      - name: Patch headers-more for MSVC precompiled header
        run: |
          for f in headers-more/src/*.c; do
              sed -i '1i #include <ngx_config.h>' "$f"
              head -1 "$f"
          done

      - name: Locate Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          if (-not $vs) { throw 'Visual C++ tools not found' }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV

      - name: Configure and build
        shell: cmd
        run: |
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" %ARCH%
          if errorlevel 1 exit /b 1

          rem OpenSSL needs a native Windows perl, not the MSYS one.
          set "PATH=C:\Strawberry\perl\bin;%PATH%"
          where perl
          perl -MConfig -e "exit($Config{osname} eq 'MSWin32' ? 0 : 1)"
          if errorlevel 1 (echo ::error::perl on PATH is not a Windows perl & exit /b 1)

          "C:\Program Files\Git\bin\bash.exe" build/configure.sh
          if errorlevel 1 exit /b 1

          cd nginx
          nmake
          if errorlevel 1 exit /b 1

      - name: Test that the Server header is removed
        run: |
          t=smoke
          mkdir -p $t/conf $t/logs $t/temp $t/html
          cp "nginx/$OBJS/nginx.exe" $t/
          cp nginx/conf/mime.types $t/conf/
          echo ok > $t/html/index.html

          cat > $t/conf/nginx.conf <<'EOF'
          worker_processes  1;
          events { worker_connections  64; }
          http {
              include  mime.types;
              more_clear_headers  Server;
              server {
                  listen  127.0.0.1:8080;
                  location / { root html; }
              }
          }
          EOF

          cd $t
          ./nginx.exe -V
          ./nginx.exe -t

          ./nginx.exe &
          trap './nginx.exe -s stop || true' EXIT
          sleep 3

          curl -sS -D headers.txt -o /dev/null http://127.0.0.1:8080/
          cat headers.txt

          grep -q '^HTTP/1.1 200' headers.txt
          if grep -qi '^server:' headers.txt; then
              echo "::error::Server header is still present"
              exit 1
          fi

      - name: Package
        run: |
          d="dist/$PKG_NAME"
          lib="nginx/$OBJS/lib"

          mkdir -p "$d"/{conf,html,logs,temp,docs}
          cp "nginx/$OBJS/nginx.exe" "$d/"
          cp nginx/conf/* "$d/conf/"
          cp nginx/docs/html/* "$d/html/"

          cp nginx/LICENSE "$d/docs/nginx.LICENSE"
          cp "$lib/$OPENSSL/LICENSE.txt" "$d/docs/OpenSSL.LICENSE"
          cp "$lib/$PCRE/LICENCE.md" "$d/docs/PCRE.LICENCE"
          sed -ne '/^ (C) 1995-20/,/^  jloup@gzip\.org/p' "$lib/$ZLIB/README" \
              > "$d/docs/zlib.LICENSE"
          cp headers-more/README.markdown "$d/docs/headers-more.README.md"

          {
              echo "nginx         $NGINX_VERSION  (nginx/nginx $(git -C nginx rev-parse HEAD))"
              echo "headers-more  $HEADERS_MORE_VERSION  (openresty/headers-more-nginx-module $(git -C headers-more rev-parse HEAD))"
              echo "arch          $ARCH"
              echo
              (cd dl && sha256sum *.tar.gz)
              echo "built by      $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              "$d/nginx.exe" -V 2>&1
              echo
              (cd "$d" && sha256sum nginx.exe)
          } > "$d/BUILD-INFO.txt"

          { echo '```'; cat "$d/BUILD-INFO.txt"; echo '```'; } > dist/notes.md
          cat dist/notes.md | tee -a "$GITHUB_STEP_SUMMARY"

          # Windows' own tar (bsdtar) writes zip and keeps the empty
          # logs/ and temp/ directories nginx needs.
          (cd dist && /c/Windows/System32/tar.exe --format zip -cf "$PKG_NAME.zip" "$PKG_NAME")

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$PKG_NAME" "dist/$PKG_NAME.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$PKG_NAME" \
              --notes-file dist/notes.md
