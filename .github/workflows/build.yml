name: build nginx for Windows with headers-more

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      arch:
        description: CPU architecture
        type: choice
        options: [x64, x86]
        default: x64

permissions:
  contents: read

jobs:
  build:
    # VS 2022 (v17) is listed as known to work in
    # https://nginx.org/en/docs/howto_build_on_win32.html;
    # windows-latest ships VS 2026.
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      ARCH: ${{ inputs.arch || 'x64' }}

      NGINX_VERSION: 1.31.7
      HEADERS_MORE_VERSION: v0.41

      # Which library versions are used comes from nginx's
      # misc/GNUmakefile, same as the official Windows build.
      # SHA256 cross-checked with the openssl .sha256 file, zlib.net and
      # GitHub release asset digests.
      DEPS_SHA256: |
        a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2  openssl-3.5.8.tar.gz
        bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16  zlib-1.3.2.tar.gz
        ebcc25aadf2a51fa1fefa9b8bc9e7a79b3dae86870a0f1152a22e42befd46888  pcre2-10.48.tar.gz

    defaults:
      run:
        shell: bash

    steps:
      # nginx's configure is a shell script and breaks with CRLF.
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout nginx
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: nginx/nginx
          ref: release-${{ env.NGINX_VERSION }}
          path: nginx
          persist-credentials: false

      - name: Checkout headers-more
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: openresty/headers-more-nginx-module
          ref: ${{ env.HEADERS_MORE_VERSION }}
          path: headers-more
          persist-credentials: false

      - name: Read official build settings
        run: |
          for v in OBJS OPENSSL ZLIB PCRE; do
              val=$(sed -nE "s/^$v[[:space:]]*=//p" nginx/misc/GNUmakefile | tr -d '[:space:]')
              test -n "$val"
              echo "$v=$val" | tee -a "$GITHUB_ENV"
          done

      - name: Download and verify libraries
        run: |
          mkdir -p dl "nginx/$OBJS/lib"
          echo "$DEPS_SHA256" > dl/SHA256SUMS

          fetch() {
              local f="${1##*/}"
              if ! grep -q "  $f\$" dl/SHA256SUMS; then
                  echo "::error::$f has no SHA256 in DEPS_SHA256 (build.yml)"
                  exit 1
              fi
              curl -fsSL --retry 3 -o "dl/$f" "$1"
              (cd dl && grep "  $f\$" SHA256SUMS | sha256sum -c -)
              tar -xzf "dl/$f" -C "nginx/$OBJS/lib"
          }

          fetch "https://github.com/openssl/openssl/releases/download/$OPENSSL/$OPENSSL.tar.gz"
          fetch "https://github.com/madler/zlib/releases/download/v${ZLIB#zlib-}/$ZLIB.tar.gz"
          fetch "https://github.com/PCRE2Project/pcre2/releases/download/$PCRE/$PCRE.tar.gz"

          ls "nginx/$OBJS/lib"
          test -d "nginx/$OBJS/lib/$OPENSSL"
          test -d "nginx/$OBJS/lib/$ZLIB"
          test -d "nginx/$OBJS/lib/$PCRE"

      # MSVC builds nginx with the precompiled header ngx_config.h
      # (-Yungx_config.h), so every .c file must include it first.
      # headers-more includes it via ddebug.h, which fails with
      # C4603/C2143, see headers-more issues #24 and #167.
      - name: Patch headers-more for MSVC precompiled header
        run: |
          for f in headers-more/src/*.c; do
              sed -i '1i #include <ngx_config.h>' "$f"
              head -1 "$f"
          done

      - name: Locate Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          if (-not $vs) { throw 'Visual C++ tools not found' }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV

      - name: Configure and build
        shell: cmd
        run: |
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" %ARCH%
          if errorlevel 1 exit /b 1

          rem OpenSSL needs a native Windows perl, not the MSYS one.
          set "PATH=C:\Strawberry\perl\bin;%PATH%"
          where perl
          perl -MConfig -e "exit($Config{osname} eq 'MSWin32' ? 0 : 1)"
          if errorlevel 1 (echo ::error::perl on PATH is not a Windows perl & exit /b 1)

          "C:\Program Files\Git\bin\bash.exe" build/configure.sh
          if errorlevel 1 exit /b 1

          cd nginx
          nmake
          if errorlevel 1 exit /b 1

      - name: Test that the Server header is removed
        run: |
          t=smoke
          mkdir -p $t/conf $t/logs $t/temp $t/html
          cp "nginx/$OBJS/nginx.exe" $t/
          cp nginx/conf/mime.types $t/conf/
          echo ok > $t/html/index.html

          cat > $t/conf/nginx.conf <<'EOF'
          worker_processes  1;
          events { worker_connections  64; }
          http {
              include  mime.types;
              more_clear_headers  Server;
              server {
                  listen  127.0.0.1:8080;
                  location / { root html; }
              }
          }
          EOF

          cd $t
          ./nginx.exe -V
          ./nginx.exe -t

          ./nginx.exe &
          trap './nginx.exe -s stop || true' EXIT
          sleep 3

          curl -sS -D headers.txt -o /dev/null http://127.0.0.1:8080/
          cat headers.txt

          grep -q '^HTTP/1.1 200' headers.txt
          if grep -qi '^server:' headers.txt; then
              echo "::error::Server header is still present"
              exit 1
          fi

      - name: Package
        run: |
          name="nginx-$NGINX_VERSION-headers-more-$HEADERS_MORE_VERSION-$ARCH"
          d="dist/$name"
          lib="nginx/$OBJS/lib"

          mkdir -p "$d"/{conf,html,logs,temp,docs}
          cp "nginx/$OBJS/nginx.exe" "$d/"
          cp nginx/conf/* "$d/conf/"
          cp nginx/docs/html/* "$d/html/"

          cp nginx/LICENSE "$d/docs/nginx.LICENSE"
          cp "$lib/$OPENSSL/LICENSE.txt" "$d/docs/OpenSSL.LICENSE"
          cp "$lib/$PCRE/LICENCE.md" "$d/docs/PCRE.LICENCE"
          sed -ne '/^ (C) 1995-20/,/^  jloup@gzip\.org/p' "$lib/$ZLIB/README" \
              > "$d/docs/zlib.LICENSE"
          cp headers-more/README.markdown "$d/docs/headers-more.README.md"

          {
              echo "nginx         $NGINX_VERSION  (nginx/nginx $(git -C nginx rev-parse HEAD))"
              echo "headers-more  $HEADERS_MORE_VERSION  (openresty/headers-more-nginx-module $(git -C headers-more rev-parse HEAD))"
              echo "arch          $ARCH"
              echo
              (cd dl && sha256sum *.tar.gz)
              echo "built by      $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              "$d/nginx.exe" -V 2>&1
              echo
              (cd "$d" && sha256sum nginx.exe)
          } > "$d/BUILD-INFO.txt"

          cat "$d/BUILD-INFO.txt"
          { echo '```'; cat "$d/BUILD-INFO.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          echo "PKG_NAME=$name" >> "$GITHUB_ENV"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: ${{ env.PKG_NAME }}
          path: dist/${{ env.PKG_NAME }}
          if-no-files-found: error
